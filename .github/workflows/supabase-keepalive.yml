name: Supabase Keep-Alive

on:
  schedule:
    # Every 6 days keeps the project alive past the 7-day inactivity pause.
    # GitHub's cron runs in UTC.
    - cron: '0 12 */6 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_data?select=user_id&limit=1"
