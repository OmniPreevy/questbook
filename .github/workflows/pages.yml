name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build backdrops manifest
        run: |
          python3 - <<'PY'
          import json, os
          exts = (".png", ".jpg", ".jpeg", ".webp", ".gif", ".avif")
          files = sorted(f for f in os.listdir("backdrops")
                         if os.path.isfile(os.path.join("backdrops", f))
                         and f.lower().endswith(exts))
          with open("backdrops/manifest.json", "w") as fh:
              json.dump(files, fh)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
